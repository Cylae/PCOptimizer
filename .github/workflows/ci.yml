name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Pester Unit Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PowerShell Modules
        shell: pwsh
        run: |
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./PCOptimizer.psd1
          Write-Host "Manifest Validated: $($manifest.Name) v$($manifest.Version)"

      - name: Strict-Mode Module Import
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module ./PCOptimizer.psd1 -Force
          $commands = Get-Command -Module PCOptimizer
          Write-Host "Exported Commands Count: $($commands.Count)"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1 -Recurse
          if ($results) {
              $results | Format-Table -AutoSize
              $errors = $results | Where-Object { $_.Severity -eq 'Error' }
              if ($errors.Count -gt 0) {
                  throw "$($errors.Count) PSScriptAnalyzer errors detected."
              }
          } else {
              Write-Host "PSScriptAnalyzer passed with zero issues."
          }

      - name: Run Pester Unit Tests
        shell: pwsh
        run: |
          & ./Tests/Run-Tests.ps1 -Detailed

      - name: Run Full Pipeline Dry-Run Simulation
        shell: pwsh
        run: |
          Import-Module ./PCOptimizer.psd1 -Force
          Invoke-PCOptimization -DryRun
